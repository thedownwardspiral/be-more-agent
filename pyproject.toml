[project]
name = "be-more-agent"
version = "0.1.0"
description = "A Raspberry Pi conversational AI agent with wake word, Parakeet STT, Claude, and Piper TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy",
    "scipy",
    # 0.5.0+ requires tflite-runtime on Linux, which publishes no wheel for
    # CPython 3.13 / aarch64. pip silently backtracked to 0.4.0; uv errors, so
    # pin the boundary explicitly. Revisit if tflite-runtime ships cp313 wheels.
    "openwakeword<0.5",
    "onnxruntime",
    # agent.py's interrupt path reaches into the 0.x SDK's httpx stream
    # (response.extensions["network_stream"]); 1.x moves to httpx2. Upgrade
    # across the major version deliberately, not via a routine `uv lock --upgrade`.
    "anthropic>=0.120,<1",
    "python-dotenv",
    "ddgs",
    "Pillow",
    "piper-tts",
    # In-process speech-to-text (Parakeet) and voice activity detection (Silero).
    # sherpa-onnx-core ships the libonnxruntime.so it links against. It is listed
    # explicitly because some sherpa-onnx wheels (linux_armv7l) omit that
    # dependency and uv locks from them, leaving aarch64 with an unimportable
    # module. The two must stay on the same version.
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
]

[project.urls]
Repository = "https://github.com/thedownwardspiral/be-more-agent"
"Original project" = "https://github.com/brenpoly/be-more-agent"

[dependency-groups]
# Not installed by setup.sh or start_agent.sh (see default-groups below).
# Run the tests with `uv run --group dev pytest`.
dev = ["pytest>=8"]

# agent.py is a top-level script plus the bmo/ helper package next to it, not
# an installable package.
[tool.uv]
package = false
default-groups = []

# The GUI needs tkinter, which comes from the apt package python3-tk installed by
# setup.sh — that only equips the system interpreter. Forbid uv from silently
# downloading a managed CPython, which would build a .venv with no working Tk.
python-preference = "only-system"

# Lint with `uvx ruff check agent.py bmo tests` (ruff is not a project dependency).
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Import order in agent.py is deliberate: DISPLAY, chdir and logging must run before the GUI/audio imports.
per-file-ignores = { "agent.py" = ["E402"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
